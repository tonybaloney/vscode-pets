name: Verify Gifs Filename

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - name: Verify Gifs Filename
              run: |
                  npm ci
                  npm run compile:test
                  npx mocha --ui tdd out/test/gifs.test.js
                  npm run test:gifs
