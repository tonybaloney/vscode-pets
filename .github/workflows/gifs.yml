name: Verify Gifs Filename

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        # Playwright 1.54.1 does not support Ubuntu 26.04.
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v6
            - name: Verify Gifs Filename
              run: |
                  npm ci
                  npm run compile:test
                  npx mocha --ui tdd out/test/gifs.test.js
                  npm run test:gifs
